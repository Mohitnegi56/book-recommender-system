<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Recommender</title>

<style>
body {
    background: url('https://images.unsplash.com/photo-1512820790803-83ca734da794') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial;
}

.navbar {
    background: #00a65a;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    color: white;
}

.navlist {
    display: flex;
    list-style: none;
    gap: 20px;
}

.navlist a {
    color: white;
    text-decoration: none;
}

.topbooks {
    text-align: center;
    color: white;
    margin-top: 20px;
}

.col-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 10px;
    color: white;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}
</style>

</head>

<body>

<nav class="navbar">
    <h2>📚 Book Recommender</h2>
    <ul class="navlist">
        <li><a href="/">Home</a></li>
        <li><a href="/recommend">Recommend</a></li>
    </ul>
</nav>

<h1 class="topbooks">Top 50 Books</h1>

<div class="col-3">
{% for i in range(book_name|length) %}
    <div class="card">
        <img src="{{ image[i] }}">
        <h3>{{ book_name[i] }}</h3>
        <p>{{ author[i] }}</p>
        <p>⭐ {{ rating[i] }}</p>
        <p>Votes: {{ votes[i] }}</p>
    </div>
{% endfor %}
</div>

</body>
</html>
