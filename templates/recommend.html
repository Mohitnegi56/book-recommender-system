<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recommend Books</title>

<style>
body {
    background: url('https://images.unsplash.com/photo-1512820790803-83ca734da794') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial;
}

.container {
    text-align: center;
    margin-top: 50px;
}

input {
    padding: 10px;
    width: 300px;
}

button {
    padding: 10px 20px;
    background: green;
    color: white;
    border: none;
}

.col-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 10px;
    color: white;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}
</style>

</head>

<body>

<div class="container">

<h1>📚 Book Recommendation</h1>

<!-- 🔥 FIXED FORM -->
<form action="/recommend_books" method="POST">
    <input type="text" name="user_input" placeholder="Enter book name" required>
    <button type="submit">Recommend</button>
</form>

<!-- ERROR -->
{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<!-- RESULTS -->
{% if data %}
    <div class="col-3">
        {% for i in data %}
            <div class="card">
                <img src="{{ i[2] }}">
                <h3>{{ i[0] }}</h3>
                <p>{{ i[1] }}</p>
            </div>
        {% endfor %}
    </div>
{% endif %}

</div>

</body>
</html>
