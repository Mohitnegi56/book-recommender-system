<!DOCTYPE html>
<html>
<head>
<title>Recommend</title>

<style>
body {
    background: black;
    color: white;
    font-family: Arial;
}

.container {
    text-align: center;
    margin-top: 40px;
}

input {
    padding: 12px;
    width: 350px;
    border-radius: 5px;
}

button {
    padding: 12px 20px;
    background: red;
    color: white;
    border: none;
}

/* 🔥 Netflix style */
.row {
    margin-top: 30px;
    padding: 20px;
}

.row h2 {
    margin-left: 20px;
}

.row-posters {
    display: flex;
    overflow-x: scroll;
    gap: 15px;
    padding: 20px;
}

.row-posters img {
    max-height: 250px;
    transition: transform 0.3s;
}

.row-posters img:hover {
    transform: scale(1.2);
}

/* autocomplete dropdown */
#suggestions {
    background: white;
    color: black;
    width: 350px;
    margin: auto;
    text-align: left;
    position: absolute;
}

.suggestion-item {
    padding: 10px;
    cursor: pointer;
}

.suggestion-item:hover {
    background: lightgray;
}
</style>

<script>
function fetchSuggestions() {
    let query = document.getElementById("search").value;

    if (query.length < 2) {
        document.getElementById("suggestions").innerHTML = "";
        return;
    }

    fetch(`/autocomplete?q=${query}`)
        .then(res => res.json())
        .then(data => {
            let suggestions = data.map(item =>
                `<div class="suggestion-item" onclick="selectItem('${item}')">${item}</div>`
            ).join("");

            document.getElementById("suggestions").innerHTML = suggestions;
        });
}

function selectItem(value) {
    document.getElementById("search").value = value;
    document.getElementById("suggestions").innerHTML = "";
}
</script>

</head>

<body>

<div class="container">
    <h1>🎬 Book Recommender</h1>

    <form action="/recommend_books" method="POST">
        <input id="search" name="user_input" onkeyup="fetchSuggestions()" placeholder="Search book...">
        <button type="submit">Search</button>
    </form>

    <div id="suggestions"></div>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
</div>

{% if data %}
<div class="row">
    <h2>Recommended Books</h2>
    <div class="row-posters">
        {% for i in data %}
            <div>
                <img src="{{ i[2] }}">
                <p>{{ i[0] }}</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endif %}

</body>
</html>
